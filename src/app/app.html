<form [formGroup]="form" class="filters">
  <label>
    Vegetarian
    <select formControlName="vegeterian">
      <option value="any">Any</option>
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>

  <label>
    Nuts
    <select formControlName="nuts">
      <option value="any">Any</option>
      <option value="true">With nuts</option>
      <option value="false">No nuts</option>
    </select>
  </label>

  <label>
    Spiciness
    <select formControlName="spiciness">
      <option value="any">Any</option>
      <option value="0">0 - Not spicy</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4 - Very spicy</option>
    </select>
  </label>

  <button type="button" (click)="reset()">Reset</button>
</form>

<ng-container *ngIf="state$ | async as state">
  <p *ngIf="state.loading">Loading...</p>
  <p *ngIf="state.error">{{ state.error }}</p>
  <p *ngIf="!state.loading && !state.error && state.products.length === 0">No products found.</p>

  <div class="grid">
    <div class="card" *ngFor="let p of state.products; trackBy: trackById">
      <img *ngIf="p.image" [src]="p.image" [alt]="p.name" />
      <h3>{{ p.name }}</h3>
      <p *ngIf="p.category?.name">{{ p.category?.name }}</p>
      <p><b>{{ p.price }} ₾</b></p>
      <p>Vegetarian: {{ p.vegeterian ? 'Yes' : 'No' }}</p>
      <p>Nuts: {{ p.nuts ? 'Yes' : 'No' }}</p>
      <p>Spiciness: {{ p.spiciness }}</p>
    </div>
  </div>
</ng-container>
